# Agent skills come from floating upstream checkouts, not from this repository.
#
# One upstream per line: owner/repo  branch  include-dir[,include-dir...]
# bootstrap.sh clones each repository under ~/.local/share/dotfiles/upstreams/
# and symlinks every directory containing SKILL.md into ~/.agents/skills.
# verify.sh reads this same file, so the two cannot disagree about the set.
#
# Order matters: if two upstreams publish a skill with the same name, the first
# line wins and bootstrap warns. Only the included directories are mirrored, so
# experimental, deprecated and repo-only skills never install by accident.

mattpocock/skills             main  skills/engineering,skills/productivity
cathrynlavery/diagram-design  main  skills
vercel-labs/skills            main  skills
