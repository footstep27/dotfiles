<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="repo-overview-title repo-overview-desc" id="repo-overview-root">
        <title id="repo-overview-title">How dotfiles reaches your machine</title>
        <desc id="repo-overview-desc">Diagram showing edits landing in the chezmoi source repo, a sync step copying them into live configs under the home directory, and the terminal tools that read them, with a bootstrap path that also installs agent skills.</desc>
        <defs>
      <style>#repo-overview-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #repo-overview-root { font-family: var(--font-sans); color: var(--color-ink); }
      #repo-overview-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#repo-overview-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="repo-overview-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="repo-overview-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="repo-overview-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Editorial callout: the mental model -->
        <text x="40" y="72" fill="#2d3142" font-size="14" font-style="italic"
              font-family="'Instrument Serif', serif">the repo is the source — $HOME holds copies</text>
        <path d="M 336,78 Q 392,112 352,180" fill="none" stroke="#2d3142"
              stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.40"/>
        <circle cx="352" cy="180" r="2" fill="#2d3142"/>

        <!-- Arrows first (behind boxes) -->
        <line x1="144" y1="220" x2="188" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#repo-overview-arrow)"/>
        <line x1="396" y1="220" x2="424" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#repo-overview-arrow)"/>
        <line x1="580" y1="220" x2="632" y2="220" stroke="#bf4520" stroke-width="1.4" marker-end="url(#repo-overview-arrow-accent)"/>
        <line x1="780" y1="220" x2="820" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#repo-overview-arrow)"/>
        <path d="M 396,392 H 494 Q 502,392 502,384 V 260" fill="none" stroke="#4f5d75"
              stroke-width="1" stroke-dasharray="4,3" marker-end="url(#repo-overview-arrow)"/>

        <!-- Arrow labels -->
        <rect x="150" y="200" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="166" y="210" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.08em">PULL</text>

        <rect x="590" y="200" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="606" y="210" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.08em">COPY</text>

        <rect x="786" y="200" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="800" y="210" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.08em">READ</text>

        <rect x="510" y="316" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="514" y="325" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace"
              letter-spacing="0.08em">NEW MACHINE</text>

        <!-- Node: GitHub -->
        <rect x="40" y="184" width="104" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="184" width="104" height="72" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <rect x="48" y="192" width="40" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.20"/>
        <text x="68" y="201" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REMOTE</text>
        <text x="92" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">GitHub</text>
        <text x="92" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">origin/main</text>

        <!-- Node: dotfiles repo (source) -->
        <rect x="188" y="180" width="208" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="188" y="180" width="208" height="80" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="196" y="188" width="40" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="216" y="197" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SOURCE</text>
        <text x="292" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dotfiles repo</text>
        <text x="292" y="244" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">~/Repositories/dotfiles</text>

        <!-- Node: chezmoi apply (focal) -->
        <rect x="424" y="180" width="156" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="424" y="180" width="156" height="80" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <rect x="432" y="188" width="32" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="448" y="197" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
        <text x="502" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">chezmoi apply</text>
        <text x="502" y="244" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">copies · no symlinks</text>

        <!-- Node: live configs -->
        <rect x="632" y="180" width="148" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="632" y="180" width="148" height="80" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="640" y="188" width="32" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="656" y="197" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOME</text>
        <text x="706" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">live configs</text>
        <text x="706" y="244" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">~/.config · ~/.zshrc</text>

        <!-- Node: apps -->
        <rect x="820" y="180" width="100" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="820" y="180" width="100" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="828" y="188" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="844" y="197" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APPS</text>
        <text x="870" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">your apps</text>
        <text x="870" y="244" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Ghostty · tmux</text>

        <!-- Node: bootstrap.sh (input, setup/update) -->
        <rect x="188" y="356" width="208" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="188" y="356" width="208" height="72" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <rect x="196" y="364" width="40" height="12" rx="2" fill="none" stroke="#5a6580" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="216" y="373" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SCRIPT</text>
        <text x="292" y="396" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">bootstrap.sh</text>
        <text x="292" y="412" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">brew · age · apply · skills</text>

        <!-- Legend -->
        <line x1="40" y1="536" x2="920" y2="536" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
        <text x="40" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
        <line x1="120" y1="556" x2="144" y2="556" stroke="#4f5d75" stroke-width="1.2"/>
        <text x="152" y="559" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">daily sync</text>
        <line x1="330" y1="556" x2="354" y2="556" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="362" y="559" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">bootstrap run</text>
        <line x1="560" y1="556" x2="584" y2="556" stroke="#bf4520" stroke-width="1.4"/>
        <text x="592" y="559" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">focal step</text>
      </svg>
