<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How dotfiles reaches your machine (dark)</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Chezmoi</p>
    <h1>How this repo reaches your machine</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="repo-overview-dark-title repo-overview-dark-desc">
        <title id="repo-overview-dark-title">How dotfiles reaches your machine</title>
        <desc id="repo-overview-dark-desc">Diagram showing edits landing in the chezmoi source repo, a sync step copying them into live configs under the home directory, and the terminal tools that read them, with a one-time bootstrap path.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#2d3142"/>

        <!-- Editorial callout: the mental model -->
        <text x="40" y="72" fill="#f5f5f5" font-size="14" font-style="italic"
              font-family="'Instrument Serif', serif">the repo is the source — $HOME holds copies</text>
        <path d="M 336,78 Q 392,112 352,180" fill="none" stroke="rgba(245,245,245,0.40)"
              stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="352" cy="180" r="2" fill="#f5f5f5"/>

        <!-- Arrows first (behind boxes) -->
        <line x1="144" y1="220" x2="188" y2="220" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="396" y1="220" x2="424" y2="220" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="580" y1="220" x2="632" y2="220" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="780" y1="220" x2="820" y2="220" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 396,392 H 494 Q 502,392 502,384 V 260" fill="none" stroke="#bfc0c0"
              stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="150" y="200" width="32" height="12" rx="2" fill="#2d3142"/>
        <text x="166" y="210" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.08em">PULL</text>

        <rect x="590" y="200" width="32" height="12" rx="2" fill="#2d3142"/>
        <text x="606" y="210" fill="#f08a59" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.08em">COPY</text>

        <rect x="786" y="200" width="28" height="12" rx="2" fill="#2d3142"/>
        <text x="800" y="210" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.08em">READ</text>

        <rect x="510" y="316" width="68" height="12" rx="2" fill="#2d3142"/>
        <text x="514" y="325" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace"
              letter-spacing="0.08em">NEW MACHINE</text>

        <!-- Node: GitHub -->
        <rect x="40" y="184" width="104" height="72" rx="6" fill="#2d3142"/>
        <rect x="40" y="184" width="104" height="72" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
        <rect x="48" y="192" width="40" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.22)" stroke-width="0.8"/>
        <text x="68" y="201" fill="#949eb2" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REMOTE</text>
        <text x="92" y="224" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">GitHub</text>
        <text x="92" y="240" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">origin/main</text>

        <!-- Node: dotfiles repo (source) -->
        <rect x="188" y="180" width="208" height="80" rx="6" fill="#2d3142"/>
        <rect x="188" y="180" width="208" height="80" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="196" y="188" width="40" height="12" rx="2" fill="transparent" stroke="rgba(191,192,192,0.40)" stroke-width="0.8"/>
        <text x="216" y="197" fill="#949eb2" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SOURCE</text>
        <text x="292" y="228" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dotfiles repo</text>
        <text x="292" y="244" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">~/Repositories/dotfiles</text>

        <!-- Node: chezmoi apply (focal) -->
        <rect x="424" y="180" width="156" height="80" rx="6" fill="#2d3142"/>
        <rect x="424" y="180" width="156" height="80" rx="6" fill="rgba(240,138,89,0.08)" stroke="#f08a59" stroke-width="1"/>
        <rect x="432" y="188" width="32" height="12" rx="2" fill="transparent" stroke="rgba(240,138,89,0.50)" stroke-width="0.8"/>
        <text x="448" y="197" fill="#f08a59" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
        <text x="502" y="228" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">chezmoi apply</text>
        <text x="502" y="244" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">copies · no symlinks</text>

        <!-- Node: live configs -->
        <rect x="632" y="180" width="148" height="80" rx="6" fill="#2d3142"/>
        <rect x="632" y="180" width="148" height="80" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="640" y="188" width="32" height="12" rx="2" fill="transparent" stroke="rgba(191,192,192,0.40)" stroke-width="0.8"/>
        <text x="656" y="197" fill="#949eb2" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOME</text>
        <text x="706" y="228" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">live configs</text>
        <text x="706" y="244" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">~/.config · ~/.zshrc</text>

        <!-- Node: apps -->
        <rect x="820" y="180" width="100" height="80" rx="6" fill="#2d3142"/>
        <rect x="820" y="180" width="100" height="80" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <rect x="828" y="188" width="32" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.40)" stroke-width="0.8"/>
        <text x="844" y="197" fill="#949eb2" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APPS</text>
        <text x="870" y="228" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">your apps</text>
        <text x="870" y="244" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Ghostty · tmux</text>

        <!-- Node: bootstrap.sh (input, one-time) -->
        <rect x="188" y="356" width="208" height="72" rx="6" fill="#2d3142"/>
        <rect x="188" y="356" width="208" height="72" rx="6" fill="rgba(191,192,192,0.10)" stroke="#949eb2" stroke-width="1"/>
        <rect x="196" y="364" width="40" height="12" rx="2" fill="transparent" stroke="rgba(142,140,131,0.40)" stroke-width="0.8"/>
        <text x="216" y="373" fill="#949eb2" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SCRIPT</text>
        <text x="292" y="396" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">bootstrap.sh</text>
        <text x="292" y="412" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">brew · age · apply</text>

        <!-- Legend -->
        <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/>
        <text x="40" y="560" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
        <line x1="120" y1="556" x2="144" y2="556" stroke="#bfc0c0" stroke-width="1.2"/>
        <text x="152" y="559" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">daily sync</text>
        <line x1="330" y1="556" x2="354" y2="556" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="362" y="559" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">one-time setup</text>
        <line x1="560" y1="556" x2="584" y2="556" stroke="#f08a59" stroke-width="1.4"/>
        <text x="592" y="559" fill="#f08a59" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">focal step</text>
      </svg>
    </div>
  </div>
</body>
</html>
