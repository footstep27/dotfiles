# tmux configuration
# Managed by chezmoi — edit the copy in the dotfiles repo, not this file.

# ---------- Terminal ----------
set -g default-terminal "tmux-256color"
# Ghostty reports TERM=xterm-ghostty. Declare true colour and clipboard
# explicitly so Catppuccin and syntax highlighting survive inside a session.
set -as terminal-features ",xterm-ghostty:RGB:clipboard:usstyle"

# ---------- Behaviour ----------
set -g mouse on

# ---------- Plugins ----------
# Pinned to tags so two machines produce the same status bar. tmux-cpu has no
# tags upstream, so it is pinned to a commit instead.
set -g @plugin 'tmux-plugins/tpm#v3.1.0'
set -g @plugin 'tmux-plugins/tmux-sensible#v3.0.0'
set -g @plugin 'tmux-plugins/tmux-resurrect#v4.0.0'
set -g @plugin 'tmux-plugins/tmux-cpu#bcb110d'
set -g @plugin 'tmux-plugins/tmux-battery#v2.0.0'
set -g @plugin 'catppuccin/tmux#v2.3.2'

# ---------- Status bar ----------
# tmux cannot observe the macOS light/dark switch, so the bar stays on Macchiato
# even when Ghostty is showing Latte.
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_window_status_style "rounded"
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

set -g @catppuccin_window_text " #{pane_current_command}"
set -g @catppuccin_window_current_text " #{pane_current_command}"

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
